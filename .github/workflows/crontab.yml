name: "Update MaxMind GeoLite2 database"

on:
  schedule:
    - cron: "0 5 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download
        env:
          LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
        run: |
          rm -rf dist
          for edition in GeoLite2-ASN GeoLite2-City GeoLite2-Country; do
            mkdir -p "dist/$edition"
            curl -fsSL "https://download.maxmind.com/app/geoip_download?edition_id=$edition&license_key=$LICENSE_KEY&suffix=tar.gz" \
              | tar -xz -C "dist/$edition" --strip-components 1
          done

      - name: Push
        run: |
          git checkout -q --orphan update
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Update MaxMind GeoLite2 database $(date -u +%F)"
          git push -f origin update:master
